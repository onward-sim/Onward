# Builds the packaged Windows app (Onward.exe, no Python needed), starts it in demo mode and checks that it works.
# A version tag like v0.26.0 also attaches the zip to a GitHub release; a push to the build-test branch only tests.
# The zip holds Onward.exe and its files, README, LICENSE, CREDITS and the full source code (in "Source code").
name: Build Windows app
on:
  push:
    tags: ["v*"]
    branches: ["build-test"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pywebview
      - name: Build
        run: >
          pyinstaller --noconfirm --windowed --name Onward --icon assets/onward.ico
          --add-data "web;web" --add-data "aircraft.json;." --add-data "version.json;."
          --add-data "CREDITS.md;." --add-data "LICENSE.txt;."
          --collect-all SimConnect --collect-data certifi --hidden-import PIL.Image
          --hidden-import metno --hidden-import terrain --hidden-import trips --hidden-import accusim
          --hidden-import window --collect-all webview
          server.py
      - name: App window is packaged
        shell: pwsh
        run: |
          if (-not (Get-ChildItem -Recurse dist/Onward | Where-Object { $_.FullName -match "[\\/]webview[\\/]" } | Select-Object -First 1)) { throw "pywebview isn't in the package" }
          "pywebview packaged"
      - name: Smoke test (demo mode)
        shell: pwsh
        run: |
          $env:ONWARD_DATA = "$env:RUNNER_TEMP\onward-data"
          $p = Start-Process -FilePath "dist\Onward\Onward.exe" -ArgumentList "--demo","--no-browser","--port","8650" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\out.txt" -RedirectStandardError "$env:RUNNER_TEMP\err.txt"
          $ready = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 5
            try { $s = Invoke-RestMethod "http://localhost:8650/api/state"; if ($s.ready) { $ready = $true; break } } catch {}
          }
          Get-Content "$env:RUNNER_TEMP\out.txt" -ErrorAction SilentlyContinue | Select-Object -Last 30
          Get-Content "$env:RUNNER_TEMP\err.txt" -ErrorAction SilentlyContinue | Select-Object -Last 30
          if (-not $ready) { Stop-Process -Id $p.Id -Force; throw "Onward.exe never became ready" }
          "Ready: Onward $($s.version), at $($s.here.name)"
          Invoke-RestMethod -Method Post "http://localhost:8650/api/generate" -Body "{}" -ContentType "application/json" | Out-Null
          for ($i = 0; $i -lt 60; $i++) { Start-Sleep -Seconds 3; $s = Invoke-RestMethod "http://localhost:8650/api/state"; if ($s.offers.Count -gt 0 -and -not $s.gen.running) { break } }
          if ($s.offers.Count -eq 0) { throw "No offers generated" }
          "Offers: $($s.offers.Count)"
          $plan = Invoke-RestMethod "http://localhost:8650/api/plan?id=$($s.offers[0].id)"
          "Plan: MSA $($plan.plan.profile.msa) ft, weather $($plan.plan.profile.wx) from $($plan.plan.route_weather.source)"
          $page = Invoke-WebRequest "http://localhost:8650/" -UseBasicParsing
          if ($page.Content -notmatch "ONWARD") { throw "The page didn't load" }
          $cr = Invoke-RestMethod "http://localhost:8650/api/credits"
          if (-not $cr.credits) { throw "Credits missing from the package" }
          "Page, credits and plan OK"
          Stop-Process -Id $p.Id -Force
      - name: Zip
        shell: pwsh
        run: |
          $v = (Get-Content version.json | ConvertFrom-Json).version
          Copy-Item README.md, LICENSE.txt, CREDITS.md dist/Onward/
          # The complete source code goes inside the download (AGPL-3.0), so the package needs no outside link.
          # As a plain folder, not a zip inside the zip: antivirus scanners flag archives nested next to a program.
          git archive --format=tar --prefix="Source code/" -o "$env:RUNNER_TEMP\src.tar" HEAD
          tar -xf "$env:RUNNER_TEMP\src.tar" -C dist/Onward
          if (-not (Test-Path "dist/Onward/Source code/server.py")) { throw "Source code missing" }
          Compress-Archive -Path dist/Onward -DestinationPath "Onward-$v-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: onward-windows
          path: Onward-*-windows.zip
          retention-days: 7
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Onward-*-windows.zip
          body_path: CHANGELOG.md
