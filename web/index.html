<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onward</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#cfe98a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 16l20-8-6 12-3-5-5-1z"/></svg></span><b>ONWARD</b><span>A pilot's travel journal</span></div>
  <div class="where" id="where">…</div>
  <nav class="tabs">
    <button data-tab="fly" class="on">Fly</button>
    <button data-tab="trip">Plan a trip</button>
    <button data-tab="journal">Journal</button>
    <button data-tab="world">World</button>
    <button data-tab="hangar">Hangar</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <div class="tools"><button id="voicebtn" class="iconbtn" title="Spoken callouts">🔇</button><a class="iconbtn" href="/cockpit.html" target="_blank" title="Cockpit mode: a big, simple screen for a tablet or second monitor">Cockpit</a></div>
  <div class="sim" id="sim"><i></i><span>…</span></div>
</header>

<div class="updbar" id="updbar"></div>
<div class="modal" id="setup"></div>
<div id="boot" class="boot">Starting up…<pre id="bootlog"></pre></div>

<main id="tab-fly" class="tab on">
  <section class="side" id="side"></section>
  <section class="mapwrap"><div id="map"></div><div class="maplegend" id="legend"></div><div class="wxtime" id="wxtime" style="display:none"></div><div class="profile" id="profile"></div></section>
</main>

<main id="tab-trip" class="tab"><section class="side" id="tripside"></section><section class="mapwrap"><div id="tmap"></div><div class="maplegend" id="tlegend"></div><div class="wxtime" id="twxtime" style="display:none"></div></section></main>
<main id="tab-journal" class="tab"><div class="page" id="journal"></div></main>
<main id="tab-world" class="tab"><section class="mapwrap"><div id="wmap"></div><div class="wpanel" id="wpanel"></div></section></main>
<main id="tab-hangar" class="tab"><div class="page" id="hangar"></div></main>
<main id="tab-settings" class="tab"><div class="page" id="settings"></div></main>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="sightcard" id="sightcard"></div>
<div class="lightbox" id="lightbox"><button class="lb-x" id="lbx">✕</button><button class="lb-nav lb-prev" id="lbprev">‹</button><figure><img id="lbimg" alt=""><figcaption id="lbcap"></figcaption><button class="lb-del" id="lbdel" title="Delete this photo">Delete photo</button></figure><button class="lb-nav lb-next" id="lbnext">›</button></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="voice.js"></script>
<script src="app.js"></script>
</body>
</html>
